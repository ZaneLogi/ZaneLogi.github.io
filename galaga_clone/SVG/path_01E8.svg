<text x="150" y="138" font-size="12.5" fill="var(--text-muted)">vx 3 · vy 2 · rot +1 · 64 frames</text>
<text x="340" y="138" font-size="12.5" fill="var(--text-secondary)">gentle bend</text>
<rect x="34" y="157" width="14" height="14" rx="3" fill="var(--text-warning)"/>
<text x="58" y="168" font-size="13" class="mono" fill="var(--text-secondary)">22 0C 37</text>
<text x="150" y="168" font-size="12.5" fill="var(--text-muted)">vx 2 · vy 2 · rot +12 · 55 frames</text>
<text x="340" y="168" font-size="12.5" fill="var(--text-secondary)">hard hook</text>
<rect x="34" y="187" width="14" height="14" rx="3" fill="var(--text-danger)"/>
<text x="58" y="198" font-size="13" class="mono" fill="var(--text-secondary)">23 00 FF</text>
<text x="150" y="198" font-size="12.5" fill="var(--text-muted)">vx 3 · vy 2 · rot +0 · 255 frames</text>
<text x="340" y="198" font-size="12.5" fill="var(--text-secondary)">long tail</text>
<text x="34" y="228" font-size="13" class="mono" fill="var(--text-muted)">FF</text>
<text x="58" y="228" font-size="12.5" fill="var(--text-muted)">END</text>

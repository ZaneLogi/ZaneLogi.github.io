<text x="58" y="108" font-size="13" class="mono" fill="var(--text-secondary)">23 00 10</text>
<text x="150" y="108" font-size="12.5" fill="var(--text-muted)">vx 3 · vy 2 · rot +0 · 16 frames</text>
<text x="340" y="108" font-size="12.5" fill="var(--text-secondary)">descend</text>
<rect x="34" y="127" width="14" height="14" rx="3" fill="var(--text-success)"/>

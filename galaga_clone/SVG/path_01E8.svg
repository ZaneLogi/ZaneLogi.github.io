<text x="34" y="30" font-size="21" font-weight="500" fill="var(--text-primary)">A Galaga fly-in path, drawn from its bytecode</text>
<text x="34" y="52" font-size="14" fill="var(--text-secondary)">Path <tspan class="mono">01E8</tspan> · 4 steering segments → run through the motion model → one swoop</text>
<text x="34" y="90" font-size="15" font-weight="500" fill="var(--text-primary)">1 · The data — four 3-byte segments (each a tiny steering command)</text>

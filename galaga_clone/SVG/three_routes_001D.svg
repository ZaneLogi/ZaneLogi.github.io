<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,sans-serif">
<title>path_001D — one bytecode, three routes</title>
<style>
 /* Unconditional dark theme (see gen_path_svg.py note). */
 svg{background:#141518;--tp:#eaeaea;--ts:#b4b4b4;--tm:#8a8a8a;--acc:#7cb6ff;--warn:#fb923c;--trans:#c084fc;--grey:#6b7280;--border:#444;--pf:#161616;}
 .mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
</style>
<text x="34" y="30" font-size="21" font-weight="500" fill="var(--tp)">One bytecode, three flights — the two gates that fork it</text>
<text x="34" y="52" font-size="14" fill="var(--ts)">Path <tspan class="mono">001D</tspan> carries <tspan class="mono" fill="var(--tp)">F7</tspan> (transient) then <tspan class="mono" fill="var(--tp)">F0</tspan> (stage-8) — a bug runs exactly one route</text>
<text x="34" y="86" font-size="13" font-weight="500" fill="var(--tp)">The bytecode — two branch tokens</text>
<text x="34" y="106" font-size="12.5" class="mono" fill="var(--grey)">23 06 16</text>
<text x="113.6" y="106" font-size="12.5" class="mono" fill="var(--grey)">23 00 19</text>
<text x="193.2" y="106" font-size="12.5" class="mono" fill="var(--trans)">F7</text>
<text x="223.6" y="106" font-size="12.5" class="mono" fill="var(--grey)">23 F0 02</text>
<text x="303.2" y="106" font-size="12.5" class="mono" fill="var(--warn)">F0</text>
<text x="333.59999999999997" y="106" font-size="12.5" class="mono" fill="var(--acc)">23 F0 24</text>
<text x="413.19999999999993" y="106" font-size="12.5" class="mono" fill="var(--grey)">FB</text>
<text x="34" y="138" font-size="12" fill="var(--grey)">■ shared trunk (segments A · B · C · D)</text>
<text x="34" y="158" font-size="12" fill="var(--trans)">■ transient: <tspan class="mono">F7</tspan> → sub-path <tspan class="mono">004B</tspan></text>
<text x="46" y="174" font-size="11" fill="var(--tm)">swoop, target player (FE), leave (FF)</text>
<text x="34" y="196" font-size="12" fill="var(--acc)">■ stages 1–7: skip both gates → <tspan class="mono">FB</tspan> home</text>
<text x="34" y="216" font-size="12" fill="var(--warn)">■ stages 8+: <tspan class="mono">F0</tspan> → sub-path <tspan class="mono">005E</tspan> → <tspan class="mono">FB</tspan> home</text>
<text x="34" y="248" font-size="11.5" fill="var(--tm)">The two formation routes peel apart only</text>
<text x="34" y="264" font-size="11.5" fill="var(--tm)">at F0; the transient peels off earlier, at</text>
<text x="34" y="280" font-size="11.5" fill="var(--tm)">F7, and never comes back.</text>

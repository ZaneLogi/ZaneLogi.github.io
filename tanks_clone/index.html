<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle City — tanks_clone</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    body { display: grid; place-items: center; }
    /* NES is 256x240; scale up with nearest-neighbour */
    #screen { width: 512px; height: 480px; image-rendering: pixelated; background: #000; }
  </style>
</head>
<body>
  <canvas id="screen" width="256" height="240"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>

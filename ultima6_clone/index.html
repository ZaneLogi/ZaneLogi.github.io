<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ultima VI — engine reimplementation (bring your own data)</title>
<style>
  body { font: 14px/1.6 monospace; background: #14110c; color: #d8cdb4; margin: 0; padding: 20px; }
  h1 { font-size: 16px; color: #e8c060; margin: 0 0 4px; }
  .sub { color: #8a7f66; margin: 0 0 16px; }
  #dropzone {
    border: 2px dashed #6b5d3a; border-radius: 8px; padding: 16px; text-align: center;
    color: #b8a878; background: #1c180f; margin: 4px 0 10px;
  }
  #dropzone .dz-headline { color: #d8cdb4; }
  #dropzone .dz-sub { color: #8a7f66; font-size: 12px; margin-top: 4px; }
  #checklist { background: #0e0b07; border: 1px solid #2a2316; padding: 8px 12px; border-radius: 6px; }
  /* The whole panel is a drop target (even collapsed) — highlight it while dragging. */
  #checklist.drag { border-color: #e8c060; background: #1a1610; }
  #checklist > summary { cursor: pointer; user-select: none; list-style: none; }
  #checklist > summary::before { content: '▸ '; color: #6b5d3a; }
  #checklist[open] > summary::before { content: '▾ '; }
  #checklist[open] > summary { margin-bottom: 8px; }
  #checklist-body { margin: 0; white-space: pre; color: #d8cdb4; font: 14px monospace; }
  #log { white-space: pre-wrap; background: #0e0b07; border: 1px solid #2a2316; padding: 12px; border-radius: 6px; margin-top: 12px; min-height: 1.6em; }
  #screen { display: none; margin-top: 12px; border: 1px solid #2a2316; image-rendering: pixelated; touch-action: none; }
  #clock-hud {
    position: fixed; bottom: 12px; right: 12px;
    background: rgba(0,0,0,0.7); color: #e8c060;
    font: 13px monospace; padding: 6px 10px;
    border: 1px solid #6b5d3a; border-radius: 4px;
    /* Fixed width so the HUD doesn't resize as the variable-length probe line
       (cell objects) grows/shrinks between cells — long lines wrap instead.
       Sized to fit the widest static line (the clock readout); border-box so the
       value is the total on-screen width. */
    box-sizing: border-box; width: 384px;
    display: none; pointer-events: none;
  }
  #clock-hud.paused { border-color: #c66; }
  #clock-text { white-space: normal; }
  #clock-controls { margin-top: 4px; display: flex; gap: 4px; }
  #npc-stats { white-space: pre; margin-top: 6px; padding-top: 6px; border-top: 1px solid #2a2316; color: #b8a878; font-size: 12px; line-height: 1.45; }
  #probe-text { white-space: normal; overflow-wrap: anywhere; margin-top: 6px; padding-top: 6px; border-top: 1px solid #2a2316; color: #b8a878; font-size: 12px; line-height: 1.45; }
  #probe-text.blocked { color: #c66; }
  #probe-text.pass { color: #6c6; }
  #clock-hud button {
    pointer-events: auto;
    background: #1c180f; color: #e8c060;
    border: 1px solid #6b5d3a; border-radius: 3px;
    font: 12px monospace; padding: 2px 6px;
    cursor: pointer;
  }
  #clock-hud button:hover { background: #241d10; }
  #probe-cell {
    position: fixed; width: 16px; height: 16px;
    border: 2px solid #e8c060; box-sizing: border-box;
    outline: 1px solid #000;    /* dark halo so the yellow stands out on any tile */
    pointer-events: none; display: none;
  }
  /* I-7b UI substrate: root container holds the modal stack. Modals stack
     visually too (z-index by DOM order); UIStack appends in push order. */
  #ui-root {
    position: fixed; inset: 0;
    pointer-events: none;        /* root passes clicks; modals re-enable on themselves */
    z-index: 100;
  }
  .ui-modal {
    pointer-events: auto;
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #1c180f; color: #d8cdb4;
    border: 1px solid #6b5d3a; border-radius: 6px;
    padding: 12px 16px; min-width: 320px; max-width: 560px;
    max-height: 80vh; overflow-y: auto;
    font: 13px monospace;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  }
  /* Stacked modals nudge so the top-most is the clear focus. Plain CSS sibling
     selector: every .ui-modal after another shifts down+right a little. */
  .ui-modal + .ui-modal { transform: translate(calc(-50% + 16px), calc(-50% + 16px)); }
  .ui-modal + .ui-modal + .ui-modal { transform: translate(calc(-50% + 32px), calc(-50% + 32px)); }
  .ui-header { color: #e8c060; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #2a2316; display: flex; align-items: center; gap: 8px; }
  .ui-header .ui-icon { flex: 0 0 32px; }
  .ui-meta { color: #8a7f66; font-size: 12px; margin: 2px 0; }
  .ui-list { margin-top: 8px; }
  .ui-row { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 3px; }
  .ui-row.ui-cursor { background: #3a2f15; color: #e8c060; }
  .ui-row .ui-icon { flex: 0 0 32px; }
  .ui-row .ui-name { flex: 1 1 auto; }
  .ui-row .ui-tags { color: #8a7f66; font-size: 11px; }
  .ui-icon { image-rendering: pixelated; width: 32px; height: 32px; vertical-align: middle; }
  .ui-hint { color: #8a7f66; font-size: 11px; margin-top: 8px; padding-top: 6px; border-top: 1px solid #2a2316; }
  .ok { color: #6c6; } .miss { color: #c66; } .warn { color: #e8c060; }
</style>
</head>
<body>
<h1>Ultima VI — engine reimplementation</h1>
<details id="checklist" open>
  <summary id="checklist-summary">scanning…</summary>
  <div id="dropzone">
    <div class="dz-headline">Drop your Ultima VI data files here</div>
    <div class="dz-sub">Bring your own data — files stay in your browser (IndexedDB) and are never uploaded.</div>
  </div>
  <pre id="checklist-body"></pre>
</details>
<canvas id="screen" width="1024" height="640"></canvas>
<div id="probe-cell"></div>
<div id="ui-root"></div>
<div id="clock-hud">
  <div id="clock-text"></div>
  <div id="clock-controls">
    <button data-act="pause">⏸ pause</button>
    <button data-act="m60">−1h</button>
    <button data-act="m10">−10m</button>
    <button data-act="p10">+10m</button>
    <button data-act="p60">+1h</button>
  </div>
  <div id="npc-stats">schedule: no hour ticked yet</div>
  <div id="probe-text">hover the map…</div>
</div>
<div id="log"></div>
<script type="module" src="./main.js"></script>
</body>
</html>

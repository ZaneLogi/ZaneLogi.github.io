<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebGL Indexed Tilemap with Drag</title>
  <style>
    html, body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="glcanvas" width="512" height="512"></canvas>
<script src="./webgl_indexed_tilemap_draw_elements.js"></script>
<script>
// === Tile renderer setup ===
const canvas = document.getElementById("glcanvas");
const tileRenderer = new TileRenderer(canvas);
const gl = tileRenderer.gl;

const TILE_SIZE = 16;
const TILES_PER_ROW = 64;
const TILE_ROWS = 32;
const TILE_COUNT = TILES_PER_ROW * TILE_ROWS;
const MAP_WIDTH = 64;
const MAP_HEIGHT = 64;

// Generate fake tile data
const TILE_ATLAS_WIDTH = TILE_SIZE * TILES_PER_ROW;
const TILE_ATLAS_HEIGHT = TILE_SIZE * TILE_ROWS;
const tileTextureData = new Uint8Array(TILE_ATLAS_WIDTH * TILE_ATLAS_HEIGHT);
for (let i = 0; i < TILE_COUNT; i++) {
  const color = Math.floor(Math.random() * 256);
  const tx = i % TILES_PER_ROW;
  const ty = Math.floor(i / TILES_PER_ROW);
  for (let y = 0; y < TILE_SIZE; y++) {
    for (let x = 0; x < TILE_SIZE; x++) {
      const px = tx * TILE_SIZE + x;
      const py = ty * TILE_SIZE + y;
      tileTextureData[py * TILE_ATLAS_WIDTH + px] = color;
    }
  }
}

// Fake palette
const paletteData = new Uint8Array(256 * 4);
for (let i = 0; i < 256; i++) {
  paletteData.set([i, 255 - i, (i * 3) % 256, 255], i * 4);
}

// Fake map
const mapData = Array.from({ length: MAP_WIDTH * MAP_HEIGHT }, () => Math.floor(Math.random() * TILE_COUNT));

tileRenderer.initTextures(paletteData, tileTextureData);
tileRenderer.initBuffers();

gl.viewport(0, 0, canvas.width, canvas.height);
gl.clearColor(0, 0, 0, 1);

// mouse dragging
let dragging = false;
let dragOffset = { x: 0, y: 0 };
let lastMouse = { x: 0, y: 0 };

canvas.addEventListener("mousedown", e => {
  dragging = true;
  lastMouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("mousemove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastMouse.x;
  const dy = e.clientY - lastMouse.y;
  dragOffset.x -= dx;
  dragOffset.y -= dy;
  lastMouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("mouseup", () => dragging = false);
canvas.addEventListener("mouseleave", () => dragging = false);

// render loop
function renderLoop() {
  tileRenderer.render();
  requestAnimationFrame(renderLoop);
}

renderLoop();
</script>
</body>
</html>

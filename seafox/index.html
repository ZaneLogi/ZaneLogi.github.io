<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seafox</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    background: #000;
    color: #8a8f98;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  canvas { display: block; background: #000; }
  .keys { display: flex; gap: 2rem; align-items: flex-start; }
  .keys section { display: flex; flex-direction: column; gap: .3rem; }
  h2 {
    margin: 0 0 .1rem;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: #5c6169;
  }
  .grid { display: grid; grid-template-columns: repeat(3, 1.55rem); gap: .3rem; }
  kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 1.55rem;
    padding: .2rem .35rem;
    border: 1px solid #2b2f36;
    border-radius: 3px;
    background: #14161a;
    color: #c8ccd2;
    font: inherit;
  }
  .row { display: flex; gap: .45rem; align-items: center; }
  .row span { color: #6b7078; }
</style>
</head>
<body>
  <canvas id="screen"></canvas>

  <div class="keys">
    <section>
      <h2>Move</h2>
      <div class="grid">
        <kbd>Y</kbd><kbd>U</kbd><kbd>I</kbd>
        <kbd>H</kbd><kbd>J</kbd><kbd>K</kbd>
        <kbd>N</kbd><kbd>M</kbd><kbd>,</kbd>
      </div>
    </section>
    <section>
      <h2>Fire</h2>
      <div class="row"><kbd>D</kbd><span>vertical torpedo</span></div>
      <div class="row"><kbd>F</kbd><span>horizontal torpedo</span></div>
      <h2 style="margin-top:.55rem">Anytime</h2>
      <div class="row"><kbd>Space</kbd><span>start a game</span></div>
      <div class="row"><kbd>Esc</kbd><span>pause &mdash; any key resumes</span></div>
      <div class="row"><kbd>Ctrl</kbd><kbd>S</kbd><span>sound</span></div>
    </section>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lunar Lander — gameplay (build)</title>
  <style>
    :root { --green:#8fffa8; --dim:#6a9; --panel:#0d0f0d; }
    html, body { margin:0; background:#000; color:#cde;
                 font-family:-apple-system,"Segoe UI",sans-serif; }
    body { display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px; }
    #game { background:#000; border:1px solid #2a3; max-width:100%; height:auto;
            box-shadow:0 0 24px rgba(120,255,160,.12); }
    .panel { width:min(1024px,100%); background:var(--panel); border:1px solid #223;
             border-radius:8px; padding:12px 16px; box-sizing:border-box; }
    .row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:6px 0; }
    .label { font-family:monospace; font-size:12px; letter-spacing:.14em; color:var(--dim);
             min-width:92px; }
    label.opt { display:inline-flex; align-items:center; gap:5px; font-size:14px; cursor:pointer; }
    input[type=range] { width:340px; accent-color:var(--green); }
    #fuelval { font-family:monospace; color:var(--green); min-width:46px; text-align:right; }
    .marks { font-family:monospace; font-size:11px; color:#567; }
    .trait { font-family:monospace; font-size:12px; color:var(--green);
             margin:0 0 8px 108px; min-height:15px; }
    .hint { font-size:12px; color:#789; margin-top:8px; }
    .hint b { color:var(--green); }
  </style>
</head>
<body>
  <!-- The gameplay runtime. The CANVAS is the faithful arcade screen; everything
       BELOW it is modern HTML chrome (settings + start hint) — NOT how the cabinet
       did it. On release, play.html → index.html (CLAUDE.md "index.html migration"). -->
  <canvas id="game" width="1024" height="768"></canvas>

  <!-- Settings panel. Wiring to the game is at step 2; for now only the visual
       echo (fuel value, mode trait line) is live. -->
  <div class="panel">
    <div class="row">
      <span class="label">PLAY MODE</span>
      <label class="opt"><input type="radio" name="mode" value="0" checked> Training</label>
      <label class="opt"><input type="radio" name="mode" value="1"> Cadet</label>
      <label class="opt"><input type="radio" name="mode" value="2"> Prime</label>
      <label class="opt"><input type="radio" name="mode" value="3"> Command</label>
    </div>
    <div class="trait" id="trait">Training — gravity 17, friction + rotation clamp</div>

    <div class="row">
      <span class="label">START FUEL</span>
      <input type="range" id="fuel" min="100" max="10000" step="50" value="750">
      <span id="fuelval">750</span>
      <span class="marks">coin&nbsp;DIP: 450 · 600 · 750 · 900 &nbsp;·&nbsp; max 10000</span>
    </div>

    <div class="hint">Set options, then press <b>SPACE</b> to start (= the cabinet START switch).
      <span style="color:#567">Controls not wired yet — step 2.</span></div>
  </div>

  <script type="module" src="./main.js"></script>
  <script>
    // PREVIEW-ONLY UI echo (presentational; the real read lands in input.js at step 2).
    const TRAITS = {
      '0': 'Training — gravity 17, friction + rotation clamp',
      '1': 'Cadet — gravity 17, pure inertia (safety net removed)',
      '2': 'Prime — gravity 34 (2×), thrust ×1.5',
      '3': 'Command — gravity 17, rotational inertia',
    };
    const fuel = document.getElementById('fuel');
    const fuelval = document.getElementById('fuelval');
    fuel.addEventListener('input', () => (fuelval.textContent = fuel.value));
    for (const r of document.querySelectorAll('input[name=mode]'))
      r.addEventListener('change', () => (document.getElementById('trait').textContent = TRAITS[r.value]));
  </script>
</body>
</html>

<svg width="100%" viewBox="0 0 680 728" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,sans-serif">
<title>How Lunar Lander builds its terrain from segment glyphs</title>
<desc>24 segment glyphs compose into 16 sections, tiled left-to-right by the LNMIN table into one seamless wrapping lunar surface.</desc>
<style>
  svg{--text-primary:#1b1b1b;--text-secondary:#555;--text-muted:#8a8a8a;--text-accent:#2b6cb0;--text-success:#2f855a;--text-warning:#b7791f;--text-danger:#c53030;--border:#cfcfcf;--bg-accent:#e7f0fb;}

</style>
<text x="40" y="30" font-size="22" font-weight="500" fill="var(--text-primary)">How the terrain is built from its glyphs</text>
<text x="40" y="54" font-size="15" fill="var(--text-secondary)">24 segment-glyphs → 16 sections → one seamless wrapping surface</text>
<text x="40" y="92" font-size="16" font-weight="500" fill="var(--text-primary)">1 · The glyphs — 24 segments, each a tiny list of vector strokes</text>

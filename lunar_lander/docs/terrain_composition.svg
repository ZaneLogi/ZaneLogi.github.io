<text x="290" y="364" font-size="13" fill="var(--text-secondary)">SEG004  (3 strokes)</text>
<text x="262" y="406" font-size="13" fill="var(--text-muted)">The beam draws the glyphs nose-to-tail, so the four</text>
<text x="262" y="422" font-size="13" fill="var(--text-muted)">glyphs become one 256-wide chunk of relief — and</text>
<text x="262" y="438" font-size="13" fill="var(--text-muted)">96+32+64+64 = exactly 256, every section.</text>
<text x="40" y="474" font-size="16" font-weight="500" fill="var(--text-primary)">3 · The surface = 16 sections tiled left-to-right in LNMIN order</text>

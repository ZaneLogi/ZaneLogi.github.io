<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Asteroids — port (I-7 scaffold)</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    body {
      min-height: 100vh;
      color: #888;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      /* 3-row grid: top-bar (auto) / canvas-stage (1fr) / status (auto).
         minmax(0, 1fr) lets the middle row shrink below the canvas's
         intrinsic aspect-ratio'd size — without it the row grows to
         fit the canvas and the whole body overflows the viewport. */
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-columns: 1fr;
      height: 100vh;
    }
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 8px 12px;
      flex-wrap: wrap;
    }
    #keymap {
      font-size: 11px;
      color: #5a5;
      white-space: pre;
      pointer-events: none;
      flex: 0 0 auto;
      /* 4×2 grid — 4 movement keys flow down col 1, 3 action keys
         down col 2 (matches grid-auto-flow: column). Trims vertical
         footprint from 7 lines → 4 to give the canvas-stage more
         room. Each KEY_MAP entry renders as one child div. */
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(4, auto);
      column-gap: 16px;
    }
    #size-controls {
      font-size: 11px;
      display: flex;
      gap: 4px;
      flex: 0 0 auto;
    }
    #size-controls button {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #888;
      padding: 4px 8px;
      cursor: pointer;
      font: inherit;
    }
    #size-controls button:hover { border-color: #555; color: #aaa; }
    #size-controls button.active {
      background: #1a2a1a;
      border-color: #5a5;
      color: #aea;
    }
    /* Disabled when the chosen (W, H) doesn't fit in the current
       stage size — main.js toggles button.disabled on resize. */
    #size-controls button:disabled {
      background: #0a0a0a;
      border-color: #222;
      color: #444;
      cursor: not-allowed;
    }
    #size-controls button:disabled:hover {
      border-color: #222;
      color: #444;
    }
    /* Middle row: canvas centered + sized to fit available space.
       min-{height,width}:0 lets the row shrink below content size
       so the aspect-ratio'd canvas can actually fit. */
    #canvas-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      min-width: 0;
      padding: 8px;
    }
    /* Canvas backing store is 1024×768 (cabinet DVG visible area);
       CSS width/height is set inline by the size selector in main.js.
       Sizing math (clamp to stage + preserve 4:3) lives in JS so it
       survives both clamps simultaneously — pure-CSS aspect-ratio
       under max-width AND max-height doesn't preserve ratio. */
    #game {
      display: block;
      background: #000;
      outline: 1px solid #333;
    }
    #status {
      font-size: 11px;
      color: #5a5;
      padding: 8px 12px;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <div id="keymap"></div>
    <div id="size-controls">
      <button data-w="400" data-h="300">400×300</button>
      <button data-w="800" data-h="600">800×600</button>
      <button data-w="1024" data-h="768">1024×768</button>
      <button data-fit="true" class="active">Fit</button>
    </div>
  </div>
  <div id="canvas-stage">
    <canvas id="game" width="1024" height="768"></canvas>
  </div>
  <div id="status">starting…</div>
  <script type="module" src="main.js"></script>
</body>
</html>

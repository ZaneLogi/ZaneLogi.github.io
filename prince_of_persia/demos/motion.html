<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prince of Persia — motion (play_seq run cycle)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #1b1d22; color: #d7d9de; }
  header { background: #14161a; border-bottom: 1px solid #2a2e36; padding: 10px 16px;
           display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  h1 small { color: #8a8f99; font-weight: 400; margin-left: 6px; }
  label { display: inline-flex; gap: 6px; align-items: center; color: #a7acb6; }
  input[type=range] { width: 110px; }
  #wrap { padding: 16px; }
  #stage { display: block; border-radius: 4px; }
  #hud { margin-top: 10px; font: 11px/1.5 ui-monospace, monospace; color: #8a8f99; white-space: pre; }
  button { background: #2a2e36; color: #d7d9de; border: 1px solid #3a3f49; border-radius: 4px;
           padding: 3px 10px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Prince of Persia — motion <small>play_seq · run cycle</small></h1>
  <button id="pause">pause</button>
  <label>speed <input type="range" id="tick" min="30" max="160" step="5" value="70"><span id="tickval">70ms</span></label>
  <label>scale <input type="range" id="scale" min="1" max="6" step="1" value="3"><span id="scaleval">3×</span></label>
  <label>tint <input type="color" id="tint" value="#111318"></label>
  <label>bg <input type="color" id="bg" value="#b7b1a3"></label>
</header>
<div id="wrap">
  <canvas id="stage" width="640" height="300"></canvas>
  <div id="hud">loading…</div>
</div>
<script type="module" src="./motion.js"></script>
</body>
</html>

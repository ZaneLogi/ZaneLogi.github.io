<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prince of Persia — level 1 (real tile collision)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #14161a; color: #d7d9de;
         display: flex; flex-direction: column; min-height: 100vh; }
  header { background: #14161a; border-bottom: 1px solid #2a2e36; padding: 10px 16px;
           display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  h1 small { color: #8a8f99; font-weight: 400; margin-left: 6px; }
  label { display: inline-flex; gap: 6px; align-items: center; color: #a7acb6; }
  input[type=range] { width: 90px; }
  #wrap { padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  #stage { display: block; border-radius: 3px; image-rendering: pixelated; background: #000; }
  #hud { font: 11px/1.5 ui-monospace, monospace; color: #8a8f99; white-space: pre; }
  .help { color: #6b7180; font-size: 12px; }
  kbd { background: #2a2e36; border: 1px solid #3a3f49; border-radius: 3px; padding: 0 5px;
        font: 11px ui-monospace, monospace; color: #c7cad0; }
  button, select { background: #2a2e36; color: #d7d9de; border: 1px solid #3a3f49; border-radius: 4px;
           padding: 3px 10px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Prince of Persia <small>level 1 · real tile collision</small></h1>
  <button id="pause">pause</button>
  <label>zoom <input type="range" id="zoom" min="1" max="4" step="1" value="2"><span id="zoomval">2×</span></label>
  <label>tint <input type="color" id="tint" value="#e0d4a8"></label>
  <span class="help"><kbd>←</kbd><kbd>→</kbd> run · <kbd>Shift</kbd>+dir step · release = stop</span>
</header>
<div id="wrap">
  <canvas id="stage" width="640" height="400"></canvas>
  <div id="hud">loading…</div>
</div>
<script type="module" src="./player.js"></script>
</body>
</html>

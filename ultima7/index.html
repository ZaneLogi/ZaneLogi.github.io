<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ultima VII Map Viewer</title>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/floating_window.css">
    <link rel="stylesheet" href="./css/info_window.css">
  </head>
  <body>
    <canvas id="glcanvas"></canvas>
    <div id="tooltip"></div>

    <!-- Floating Info Window -->
    <div class="floatingWindow" id="infoWindow">
      <div class="floatingHeader">Ultima VII File Loader
        <div class="headerButtons">
          <button class="collapse-btn">−</button>
        </div>
      </div>
      <div class="floatingContent">
        <div id="dropzone">Drop Ultima VII files here</div>
        <button id="resetBtn">Reset Stored Files</button>
        <div id="fileChecklist">Checking files...</div>
        <div id="frameRate">Measuring...</div>
      </div>
    </div>

    <script src="./floating_window_manager.js"></script>
    <!--script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script-->
    <script src="./libs/jszip.min.js"></script>
    <script type="module">
        const infoWindow = new FloatingWindowManager("infoWindow");
        await import("./unittest_filestore.js");
        await import("./unittest_flexfile.js");
        await import("./map_viewer.js");

        const { setupCanvasDragging } = await import("./canvas_controls.js");
        const canvas = document.getElementById("glcanvas");
        setupCanvasDragging(canvas, 12*16*16*8);
    </script>
  </body>
</html>

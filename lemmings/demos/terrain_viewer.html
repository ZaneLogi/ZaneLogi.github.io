<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throng — Terrain &amp; Object Map Viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 14px/1.5 system-ui, sans-serif; background: #12141c; color: #d7dae3; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { margin: 0 0 18px; color: #8b90a0; font-size: 13px; max-width: 760px; }
  .sub code { color: #aab; background: #1d2030; padding: 1px 5px; border-radius: 4px; }

  .controls { display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
    background: #1a1d29; border: 1px solid #262a3a; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
  .controls label { display: flex; align-items: center; gap: 8px; color: #b9bece; }
  .controls .wide { flex: 1 1 320px; }
  input[type=range] { accent-color: #4a6be0; width: 100%; }
  .readout { font-family: ui-monospace, monospace; color: #9aa; min-width: 132px; }

  .stage { overflow-x: auto; border: 1px solid #262a3a; border-radius: 10px; background: #0a0c12; padding: 10px; }
  canvas#view { image-rendering: pixelated; display: block; cursor: grab; }
  canvas#view.drag { cursor: grabbing; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; color: #9aa0b0; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #0004; }
</style>
</head>
<body>
  <h1>Throng — Terrain &amp; Object Map Viewer</h1>
  <p class="sub">
    The 1584×160 world, written directly into the <code>src/terrain.js</code>
    collision buffer and <code>src/object_map.js</code> trigger grid, viewed
    through a scrolling window.
  </p>

  <div class="controls">
    <label class="wide">Scroll
      <input id="scroll" type="range" min="0" max="1264" step="1" value="0">
    </label>
    <span class="readout" id="readout">x 0 / 1264</span>
    <label>Zoom <input id="scale" type="range" min="1" max="4" step="1" value="1" style="width:90px"><span id="scaleVal">1×</span></label>
    <label><input id="showObjects" type="checkbox" checked> Object map</label>
    <label><input id="showGrid" type="checkbox"> 4×4 grid</label>
  </div>

  <div class="stage"><canvas id="view"></canvas></div>

  <div class="legend">
    <span><i class="sw" style="background:#8a9b5a"></i> terrain</span>
    <span><i class="sw" style="background:#3cdc5a99"></i> exit</span>
    <span><i class="sw" style="background:#3c78f099"></i> water</span>
    <span><i class="sw" style="background:#ff5a1e99"></i> fire</span>
    <span><i class="sw" style="background:#c8c8d299"></i> steel</span>
    <span><i class="sw" style="background:#50d2dc99"></i> one-way →</span>
    <span><i class="sw" style="background:#ff3fbf"></i> entrance</span>
  </div>
  <div id="error" style="color:#ff8080; white-space:pre-wrap; font-family:ui-monospace,monospace"></div>

  <script type="module" src="./terrain_viewer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throng — Skill: Bomber</title>
<link rel="stylesheet" href="./skill.css">
</head>
<body>
  <h1 id="title">Bomber</h1>
  <p class="sub" id="hint"></p>
  <p class="nav" id="nav"></p>
  <p class="sub">Bomber is a <em>fuse</em>, not a state — assigning it lights a 79-frame countdown; the
    lemming keeps doing whatever it was doing (here, walking) until the fuse expires, then "oh-no"s and
    detonates, blowing a crater in the terrain buffer (unless it is on steel or in water).</p>

  <div class="controls">
    <div class="group" id="speed">
      <button data-ms="100">Slow</button>
      <button data-ms="58" class="on">Normal</button>
      <button data-ms="20">Fast</button>
    </div>
    <button id="playPause" class="on">⏸ Pause</button>
    <button id="stepBtn">⏭ Step</button>
    <button id="assignBtn">✚ Assign</button>
    <button id="resetBtn">↻ Reset</button>
    <label>Zoom <input id="scale" type="range" min="2" max="5" step="1" value="3"><span id="scaleVal">3×</span></label>
    <label><input id="triggers" type="checkbox" checked> Show triggers/field</label>
  </div>

  <div class="stagewrap"><canvas id="stage"></canvas></div>
  <div id="hud"></div>
  <div id="error" class="err"></div>

  <script type="module">
    import { runStage } from './skill_stage.js';
    import { SKILL_SCENARIOS } from './skill_scenarios.js';
    runStage(SKILL_SCENARIOS.bomber);
  </script>
</body>
</html>

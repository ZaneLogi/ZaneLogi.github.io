<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>block_stacker — NES Tetris port</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;            /* no scrollbars — canvas is scaled to fit */
      background: #0a0c16;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
    }
    /* Fixed internal resolution (set in main.js); CSS scales it to fit the viewport. */
    canvas {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>

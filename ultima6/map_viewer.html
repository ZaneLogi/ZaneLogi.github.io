<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ultima VI Map Viewer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #tooltip {
      position: absolute;
      padding: 4px 6px;
      background: #111;
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      border: 1px solid #0f0;
      pointer-events: none;
      display: none;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #111;
    }

    ::-webkit-scrollbar-thumb {
      background-color: #0f0;
      border-radius: 5px;
      border: 2px solid #111;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: #6f6;
    }

    /* === Floating Info Window === */
    #dropzone {
      padding: 10px;
      border: 1px dashed #0f0;
      text-align: center;
      background: #222;
      margin-bottom: 10px;
    }

    #resetBtn {
      margin-bottom: 10px;
      padding: 5px 10px;
      background: #222;
      border: 1px solid #0f0;
      color: #0f0;
      cursor: pointer;
      width: 100%;
    }

    #fileChecklist {
      margin-bottom: 10px;
      padding: 5px;
      border: 1px solid #0f0;
      box-shadow: inset 0 0 6px #0f0;
      background: #111;
      font-family: monospace;
      white-space: pre;
      overflow: auto;
      max-height: 200px;
    }

    #frameRate {
      display: block;
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      padding: 8px 12px;
      background: #111;
      color: #0f0;
      border: 1px solid #0f0;
      box-shadow: inset 0 0 6px #0f0;
      font-family: monospace;
      white-space: pre-line;
    }

    /* === Generic Floating Window === */
    .floatingWindow {
      position: fixed;
      top: 100px;
      left: 100px;
      width: 320px;
      background: rgba(0, 0, 0, 0.9);
      color: #0f0;
      border: 1px solid #0f0;
      border-radius: 5px;
      z-index: 10;
      resize: both;
      overflow: hidden;
    }

    .floatingHeader {
      padding: 8px 10px;
      cursor: move;
      background: #060;
      font-weight: bold;
      user-select: none;
    }

    .floatingContent {
      padding: 10px;
      overflow: auto;
    }

    .floatingWindow.collapsed .floatingContent {
      display: none;
    }

    .floatingWindow.collapsed {
      height: auto !important;
      resize: none;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>
  <div id="tooltip"></div>

  <!-- Floating Info Window -->
  <div class="floatingWindow" id="infoWindow">
    <div class="floatingHeader">Ultima VI File Loader</div>
    <div class="floatingContent">
      <div id="dropzone">Drop Ultima VI files here</div>
      <button id="resetBtn">Reset Stored Files</button>
      <div id="fileChecklist">Checking files...</div>
      <div id="frameRate">Measuring...</div>
    </div>
  </div>

  <div class="floatingWindow" id="optionsWindow">
    <div class="floatingHeader">Options</div>
    <div class="floatingContent">
      <!-- your content -->
      <button id="reset_layout">Reset Floating Windows</button>
    </div>
  </div>


  <script type="module" src="map_viewer.js"></script>

  <script src="./floating_window_manager.js"></script>
  <script>
    document.getElementById("reset_layout").addEventListener("click", () => {
      FloatingWindowManager.resetAllLayout();
    });

    const infoWindow = new FloatingWindowManager("infoWindow");
    const optionsWindow = new FloatingWindowManager("optionsWindow");
  </script>
</body>
</html>

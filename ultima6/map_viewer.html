<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ultima VI Map Viewer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #tooltip {
      position: absolute;
      padding: 4px 6px;
      background: #111;
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      border: 1px solid #0f0;
      pointer-events: none;
      display: none;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #111;
    }

    ::-webkit-scrollbar-thumb {
      background-color: #0f0;
      border-radius: 5px;
      border: 2px solid #111;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: #6f6;
    }

    /* === Floating Info Window === */
    #infoWindow {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 320px;
      min-width: 200px;
      background: rgba(0, 0, 0, 0.9);
      color: #0f0;
      border: 1px solid #0f0;
      border-radius: 5px;
      z-index: 10;
      resize: both;
      overflow: hidden;
    }

    #infoHeader {
      padding: 8px 10px;
      cursor: move;
      background: #060;
      font-weight: bold;
      user-select: none;
    }

    #infoContent {
      padding: 10px;
      overflow: auto;
    }

    #infoWindow.collapsed #infoContent {
      display: none;
    }

    #infoWindow.collapsed {
      height: auto !important;
      resize: none;
    }

    #dropzone {
      padding: 10px;
      border: 1px dashed #0f0;
      text-align: center;
      background: #222;
      margin-bottom: 10px;
    }

    #resetBtn {
      margin-bottom: 10px;
      padding: 5px 10px;
      background: #222;
      border: 1px solid #0f0;
      color: #0f0;
      cursor: pointer;
      width: 100%;
    }

    #fileChecklist {
      margin-bottom: 10px;
      padding: 5px;
      border: 1px solid #0f0;
      box-shadow: inset 0 0 6px #0f0;
      background: #111;
      font-family: monospace;
      white-space: pre;
      overflow: auto;
      max-height: 200px;
    }

    #frameRate {
      display: block;
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      padding: 8px 12px;
      background: #111;
      color: #0f0;
      border: 1px solid #0f0;
      box-shadow: inset 0 0 6px #0f0;
      font-family: monospace;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>
  <div id="tooltip"></div>

  <!-- Floating Info Window -->
  <div id="infoWindow">
    <div id="infoHeader">Ultima VI File Loader</div>
    <div id="infoContent">
      <div id="dropzone">Drop Ultima VI files here</div>
      <button id="resetBtn">Reset Stored Files</button>
      <div id="fileChecklist">Checking files...</div>
      <div id="frameRate">Measuring...</div>
    </div>
  </div>

  <script type="module" src="map_viewer.js"></script>

  <script>
    // === Floating Window Drag & Collapse ===
    const infoWindow = document.getElementById("infoWindow");
    const infoHeader = document.getElementById("infoHeader");

    // Load saved position and collapse status
    const savedLeft = localStorage.getItem("infoWindowLeft");
    const savedTop = localStorage.getItem("infoWindowTop");
    if (savedLeft && savedTop) {
      infoWindow.style.left = savedLeft;
      infoWindow.style.top = savedTop;
    }
    const collapsed = localStorage.getItem("infoWindowCollapsed");
    if (collapsed === "1") {
      infoWindow.classList.add("collapsed");
    }

    let isDragging = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    infoHeader.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      const rect = infoWindow.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;
      e.preventDefault();
    });

    document.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      infoWindow.style.left = (e.clientX - dragOffsetX) + "px";
      infoWindow.style.top = (e.clientY - dragOffsetY) + "px";
    });

    document.addEventListener("mouseup", () => {
      if (isDragging) {
        // Save position to localStorage
        localStorage.setItem("infoWindowLeft", infoWindow.style.left);
        localStorage.setItem("infoWindowTop", infoWindow.style.top);
      }
      isDragging = false;
    });

    // === Collapse Toggle ===
    infoHeader.addEventListener("dblclick", () => {
      infoWindow.classList.toggle("collapsed");
      // Save state to localStorage
      const isCollapsed = infoWindow.classList.contains("collapsed");
      localStorage.setItem("infoWindowCollapsed", isCollapsed ? "1" : "0");
    });
  </script>
</body>
</html>

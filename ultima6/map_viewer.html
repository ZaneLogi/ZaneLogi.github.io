<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ultima VI Map Viewer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #tooltip {
      position: absolute;
      padding: 4px 6px;
      background: #111;
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      border: 1px solid #0f0;
      pointer-events: none;
      display: none;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #111;
    }

    ::-webkit-scrollbar-thumb {
      background-color: #0f0;
      border-radius: 5px;
      border: 2px solid #111;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: #6f6;
    }

    /* === Floating Info Window === */
    #dropzone {
      padding: 10px;
      border: 1px dashed #0f0;
      text-align: center;
      background: #222;
      margin-bottom: 10px;
    }

    #resetBtn {
      margin-bottom: 10px;
      padding: 5px 10px;
      background: #222;
      border: 1px solid #0f0;
      color: #0f0;
      cursor: pointer;
      width: 100%;
    }

    #fileChecklist {
      margin-bottom: 10px;
      padding: 5px;
      border: 1px solid #0f0;
      box-shadow: inset 0 0 6px #0f0;
      background: #111;
      font-family: monospace;
      white-space: pre;
      overflow: auto;
      max-height: 200px;
    }

    #frameRate {
      display: block;
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      padding: 8px 12px;
      background: #111;
      color: #0f0;
      border: 1px solid #0f0;
      box-shadow: inset 0 0 6px #0f0;
      font-family: monospace;
      white-space: pre-line;
    }

    /* === option window === */
    #optionsWindow {
      height: auto;
      resize: none;
    }

    #optionsWindow .floatingContent {
      padding: 10px;
      overflow: visible;
    }

    /* === list window === */
    #list-window {
      height: 300px;
    }

    #list-window .floatingContent {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 10px;
    }

    #list-window .list-view {
      flex-grow: 1;
      overflow-y: auto;
      border: 1px solid #0f0;
      background: #111;
      font-family: monospace;
      font-size: 13px;
      padding: 5px;
    }

    /* === generic configurations === */
    .headerButtons {
      display: flex;
      gap: 4px;
    }

    .headerButtons button {
      background: transparent;
      border: none;
      color: #0f0;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
    }

    .headerButtons button:hover {
      color: #fff;
    }

    .list-view {
      height: 200px;
      overflow-y: auto;
      border: 1px solid #0f0;
      background: #111;
      font-family: monospace;
      font-size: 13px;
      padding: 5px;
    }

    .list-item {
      padding: 2px 4px;
      border-bottom: 1px solid #333;
      cursor: default;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .list-item:hover {
      background: #0f0;
      color: #000;
    }
  </style>

  <link rel="stylesheet" href="./floating_window.css">
</head>
<body>
  <canvas id="glcanvas"></canvas>
  <div id="tooltip"></div>

  <!-- Floating Info Window -->
  <div class="floatingWindow" id="infoWindow">
    <div class="floatingHeader">Ultima VI File Loader
      <div class="headerButtons">
        <button class="collapse-btn">−</button>
      </div>
    </div>
    <div class="floatingContent">
      <div id="dropzone">Drop Ultima VI files here</div>
      <button id="resetBtn">Reset Stored Files</button>
      <div id="fileChecklist">Checking files...</div>
      <div id="frameRate">Measuring...</div>
    </div>
  </div>

  <div class="floatingWindow" id="optionsWindow">
    <div class="floatingHeader">Options</div>
    <div class="floatingContent">
      <!-- your content -->
      <button id="reset_layout">Reset Floating Windows</button>
    </div>
  </div>

  <div class="floatingWindow" id="list-window">
    <div class="floatingHeader">
      List Window
      <div class="headerButtons">
        <button class="collapse-btn">−</button>
        <button class="close-btn">×</button>
      </div>
    </div>
    <div class="floatingContent">
      <div class="list-view" id="myListView"></div>
    </div>
  </div>

  <script type="module" src="map_viewer.js"></script>

  <script src="./floating_window_manager.js"></script>
  <script>
    document.getElementById("reset_layout").addEventListener("click", () => {
      FloatingWindowManager.resetAllLayout();
    });

    const optionsWindow = new FloatingWindowManager("optionsWindow");
    const infoWindow = new FloatingWindowManager("infoWindow");
    const listWindow = new FloatingWindowManager("list-window");
  </script>
</body>
</html>
